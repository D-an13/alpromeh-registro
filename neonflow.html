<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>NEON FLOW: OVERLOAD</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; touch-action: none; cursor: crosshair; }
        canvas { display: block; }
        .hint { 
            position: absolute; bottom: 20px; width: 100%; text-align: center;
            color: #fff; font-family: sans-serif; font-size: 10px; opacity: 0.4;
            pointer-events: none; text-transform: uppercase; letter-spacing: 3px;
            text-shadow: 0 0 10px #fff;
        }
    </style>
</head>
<body>
    <div class="hint">Mueve y haz click para explotar</div>
    <canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let particles = [];
let hue = 0; // Para el ciclo de colores

const resize = () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
};
window.onresize = resize;
resize();

class Particle {
    constructor(x, y, isExplosion = false) {
        this.x = x;
        this.y = y;
        // Si es explosión, son más grandes y rápidas
        this.size = isExplosion ? Math.random() * 8 + 3 : Math.random() * 4 + 1;
        this.speedX = (Math.random() - 0.5) * (isExplosion ? 10 : 3);
        this.speedY = (Math.random() - 0.5) * (isExplosion ? 10 : 3);
        
        // Color basado en el hue actual del ciclo
        this.color = `hsl(${hue}, 100%, 60%)`;
        this.life = 1;
        // Se desvanecen a diferente velocidad
        this.decay = isExplosion ? Math.random() * 0.02 + 0.01 : Math.random() * 0.01 + 0.005;
    }
    update() {
        this.x += this.speedX;
        this.y += this.speedY;
        this.life -= this.decay;
        // También se hacen pequeñas
        if (this.size > 0.1) this.size -= 0.05;
    }
    draw() {
        ctx.fillStyle = this.color;
        ctx.globalAlpha = this.life;
        ctx.shadowBlur = isMobile ? 10 : 20; // Brillo más intenso en PC
        ctx.shadowColor = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
    }
}

const isMobile = 'ontouchstart' in window;

// Función base para crear partículas al mover
const handleMove = (e) => {
    // Si es móvil, usamos e.touches, si no, e.clientX
    const x = e.touches ? e.touches[0].clientX : e.clientX;
    const y = e.touches ? e.touches[0].clientY : e.clientY;
    
    // Creamos partículas y avanzamos el color
    for (let i = 0; i < 2; i++) {
        particles.push(new Particle(x, y));
    }
    hue += 2; // Avanza el ciclo cromático rápido
};

// Función para la explosión al hacer click o tap
const handleExplosion = (e) => {
    // Para evitar que click y tap se dupliquen en móvil
    if (e.type === 'mousedown' && isMobile) return;

    const x = e.touches ? e.touches[0].clientX : e.clientX;
    const y = e.touches ? e.touches[0].clientY : e.clientY;
    
    // Boom! Muchas partículas
    for (let i = 0; i < 30; i++) {
        particles.push(new Particle(x, y, true)); // 'true' activa modo explosión
    }
    hue += 30; // Gran salto de color
};

// Eventos de Movimiento
canvas.addEventListener('mousemove', handleMove);
canvas.addEventListener('touchmove', handleMove);

// Eventos de Click/Tap (Explosión)
canvas.addEventListener('mousedown', handleExplosion);
canvas.addEventListener('touchstart', handleExplosion);

function animate() {
    // Efecto de rastro (trail) transparente
    ctx.fillStyle = 'rgba(0, 0, 0, 0.08)'; 
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    // Desactivar shadowBlur para el fondo (mejora rendimiento)
    ctx.shadowBlur = 0;

    for (let i = 0; i < particles.length; i++) {
        particles[i].update();
        particles[i].draw();
        if (particles[i].life <= 0) {
            particles.splice(i, 1);
            i--;
        }
    }
    requestAnimationFrame(animate);
}

// Iniciar animación
animate();
</script>
</body>
</html>
