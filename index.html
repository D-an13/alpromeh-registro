<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALPROMEH - REGISTRO ORDENES</title>
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📦</text></svg>">

    <style>
        :root { 
            --bg-body: #f0f2f5; --bg-card: #ffffff; --text-main: #1e293b; 
            --primary: #1e3a8a; --secondary: #10b981; --border: #cbd5e1; 
            --input-bg: #ffffff; --placeholder: #94a3b8;
        }
        [data-theme="dark"] { 
            --bg-body: #0f172a; --bg-card: #1e293b; --text-main: #f1f5f9; 
            --primary: #3b82f6; --border: #475569; --input-bg: #1e293b; --placeholder: #64748b;
        }

        /* --- AJUSTE GLOBAL PARA EVITAR DESFASES --- */
        * { box-sizing: border-box; }

        /* --- MODAL ESTILOS --- */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); z-index: 2000; align-items: center; justify-content: center;
            backdrop-filter: blur(3px);
        }
        .modal-content {
            background: var(--bg-card); padding: 30px; border-radius: 15px;
            width: 90%; max-width: 400px; 
            /* AJUSTE: Flexbox para centrado interno perfecto */
            display: flex; flex-direction: column; align-items: center; text-align: center;
            box-shadow: 0 15px 30px rgba(0,0,0,0.4); border-top: 5px solid #dc2626;
            color: var(--text-main);
        }
        .modal-btns { display: flex; gap: 10px; margin-top: 20px; width: 100%; }
        .btn-modal { flex: 1; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .btn-cancelar { background: var(--border); color: var(--text-main); }
        .btn-confirmar { background: #dc2626; color: white; }

        /* --- BOTON PRODUCTO --- */
        .btn-producto { background: var(--primary); color: white; border: none; border-radius: 8px; width: 45px; height: 42px; cursor: pointer; font-size: 1.2rem; transition: 0.3s; }
        .btn-producto.lleno { background: #10b981 !important; }

        /* --- CLASE: ANULADA --- */
        .color-anulada { 
            background-color: #475569 !important; 
            color: #ffffff !important; 
        }
        .color-anulada td, .color-anulada select { color: #ffffff !important; }

        /* --- ANIMACIONES --- */
        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            50% { transform: translateX(8px); }
            75% { transform: translateX(-8px); }
            100% { transform: translateX(0); }
        }
        .shake { animation: shake 0.4s ease-in-out; border-top-color: #dc2626 !important; }

        @keyframes pulse-red-intense {
            0% { background-color: rgba(220, 38, 38, 0.1); }
            50% { background-color: rgba(220, 38, 38, 0.4); }
            100% { background-color: rgba(220, 38, 38, 0.1); }
        }
        .alerta-total { animation: pulse-red-intense 1.5s infinite ease-in-out !important; }

        @keyframes pulse-orange-border {
            0% { border-left: 10px solid #ff9800; }
            50% { border-left: 10px solid #e65100; }
            100% { border-left: 10px solid #ff9800; }
        }

        .alerta-duda { 
            animation: pulse-orange-border 1.5s infinite ease-in-out !important;
            background-color: #f7fee7 !important;
        }

        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg-body); color: var(--text-main); padding: 15px; display: flex; flex-direction: column; align-items: center; transition: 0.3s; }
        .contenedor { background: var(--bg-card); padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 950px; margin-bottom: 20px; border-top: 5px solid var(--primary); transition: transform 0.3s; }
        
        [data-theme="dark"] input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1); }

        input::placeholder { color: var(--placeholder); font-weight: normal; opacity: 0.8; }
        input, select { 
            width: 100%; padding: 10px; border: 2px solid var(--border); 
            border-radius: 8px; background: var(--input-bg); color: var(--text-main); font-size: 14px; box-sizing: border-box;
        }

        .color-yanet { background-color: #fef3c7 !important; color: #92400e !important; }
        .color-carmen { background-color: #f3e8ff !important; color: #6b21a8 !important; }
        .color-danna { background-color: #fae8ff !important; color: #86198f !important; }
        .color-nata-claudia { background-color: #ffedd5 !important; color: #9a3412 !important; }
        .color-gris { background-color: #f1f5f9 !important; color: #475569 !important; }
        .color-especial-dan-susan { background-color: #e0f2fe !important; color: #0369a1 !important; }
        .color-axel { background-color: #f7fee7 !important; color: #3f6212 !important; }

        .busqueda-container { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
        .input-busqueda { flex-grow: 1; min-width: 200px; border: 2px solid var(--primary) !important; }
        
        .btn-filtro { background: #64748b; color: white; border: none; padding: 8px 15px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 0.85rem; transition: 0.3s; }
        .btn-filtro.activo-hoy { background: #1e3a8a; }
        .btn-filtro.activo-preparando { background: #8b5cf6; }
        .btn-filtro.activo-atraso { background: #dc2626 !important; box-shadow: 0 0 10px #dc2626; }

        .alerta-atraso { color: #ff0000 !important; font-weight: 900 !important; text-decoration: none !important; font-size: 1.1rem; }

        .mood-container { display: flex; align-items: center; gap: 15px; margin-bottom: 10px; padding: 10px; background: rgba(120, 120, 120, 0.1); border-radius: 50px; }
        .mood-face { font-size: 35px; min-width: 45px; text-align: center; transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .barra-fondo { flex-grow: 1; background: #e2e8f0; border-radius: 20px; height: 12px; overflow: hidden; }
        .barra-llenado { background: linear-gradient(90deg, #f59e0b, #10b981); height: 100%; width: 0%; transition: width 0.8s ease; }

        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 0.85em; }
        
        .fila-despachada { background-color: #dcfce7 !important; color: #166534 !important; opacity: 0.9; }
        .fila-despachada td { color: #166534 !important; } /* Asegura color en despachados */
        
        .check-axel { width: 18px; height: 18px; cursor: pointer; accent-color: #10b981; vertical-align: middle; }
        .label-axel { font-size: 0.65em; color: var(--placeholder); display: block; font-weight: normal; margin-top: 2px; }

        .oculto { display: none !important; }

        .btn-guardar { width: 100%; padding: 15px; background: var(--secondary); color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; font-size: 1.1rem; }
        .btn-sync { background: #4f46e5; color: white; border: none; padding: 8px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 0.8rem; }
        .btn-excel { text-decoration: none; padding: 8px 12px; background: #166534; color: white; border-radius: 6px; font-size: 0.8rem; font-weight: bold; }

        .theme-switch { position: fixed; bottom: 25px; right: 25px; background: var(--primary); color: white; border: none; width: 50px; height: 50px; border-radius: 50%; cursor: pointer; font-size: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.4); z-index: 100; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px; border-bottom: 1px solid var(--border); text-align: left; font-size: 0.85em; }
        th { background: var(--primary); color: white; text-transform: uppercase; }
        #toast { position: fixed; top: 20px; right: 20px; color: white; padding: 12px 20px; border-radius: 8px; display: none; z-index: 3000; font-weight: bold; }
        #toast.warning { background-color: #ffc400; color: #000; visibility: visible; display: block; }

        .resaltar-actualizacion {
            background-color: #fff9c4 !important;
            border-top: 5px solid #ffc400 !important;
            transition: all 0.5s ease;
        }
/* Brillo verde al tocar en celulares y prevención de zoom */
@media (pointer: coarse) {
    .fila-axel-movil {
        touch-action: manipulation;
        -webkit-tap-highlight-color: rgba(16, 185, 129, 0.3);
    }
}

/* Animación rápida de éxito */
@keyframes flash-success {
    0% { background-color: transparent; }
    50% { background-color: #10b981; }
    100% { background-color: transparent; }
}
.animar-listo { animation: flash-success 0.4s ease-out; }
    </style>
</head>
<body>
    <button class="theme-switch" onclick="toggleTheme()">🌓</button>
    <div id="toast"></div>

    <div id="modalConfirm" class="modal-overlay">
        <div class="modal-content" id="modalFrame">
            <h3 style="margin-top:0;" id="modalTitle">¿Anular Orden?</h3>
            <p id="modalMsg">¿Estás seguro que deseas eliminar esta Orden de Compra?</p>
            <div class="modal-btns">
                <button class="btn-modal btn-cancelar" onclick="cerrarModal()">CANCELAR</button>
                <button id="btnConfirmarAnular" class="btn-modal btn-confirmar">ACEPTAR</button>
            </div>
        </div>
    </div>

    <div id="modalProducto" class="modal-overlay">
        <div class="modal-content" style="border-top-color: var(--primary);">
            <h3 style="margin-top:0; width: 100%;">Detalle del Producto</h3>
            <textarea id="inputProducto" maxlength="120" placeholder="Ej: cateter intravenoso, bajalenguas, jeringa..." 
                      style="width:100%; height:80px; border-radius:8px; padding:10px; border:2px solid var(--border); background:var(--input-bg); color:var(--text-main); font-family:inherit; resize: none;"></textarea>
            <div class="modal-btns">
                <button class="btn-modal btn-confirmar" style="background:var(--primary);" onclick="cerrarModalProducto()">LISTO</button>
            </div>
        </div>
    </div>
    
    <div class="contenedor">
        <div class="mood-container">
            <div id="moodFace" class="mood-face">😟</div>
            <div class="barra-fondo">
                <div id="barraProgreso" class="barra-llenado"></div>
            </div>
        </div>
    </div>

    <div class="contenedor" id="contenedorForm">
        <h2 style="text-align: center; margin-top: 0; color: var(--primary); font-weight: 800;">
            <span id="triggerHuevo" style="cursor: pointer;">📦</span> REGISTRO ÓRDENES
        </h2>
        <form id="formOrdenes">
            <div class="form-grid">
                <div><label>NO. DE ORDEN:</label><input type="number" id="orden" placeholder="Ej: 15646" required></div>
                <div><label>FECHA DE IMPRESIÓN:</label><input type="date" id="fecha" required></div>
                <div><label>INSTITUCIÓN:</label><input type="text" id="institucion" placeholder="Nombre de la entidad" required></div>
                <div>
                    <label>PERSONA QUE RECIBIÓ:</label>
                    <div style="display: flex; gap: 8px;">
                        <input type="text" id="persona" placeholder="Tu nombre" required>
                        <button type="button" id="btnProducto" class="btn-producto" onclick="abrirModalProducto()">📝</button>
                    </div>
                </div>
            </div>
            <div style="margin-top: 15px;">
                <label>RESPONSABLE ACTUAL:</label>
                <select id="responsableSelect" onchange="aplicarColorUnico(this)">
                    <option value="Yanet" class="color-yanet">Yanet</option>
                    <option value="Danna" class="color-danna">Danna</option>
                    <option value="Carmen" class="color-carmen">Carmen</option>
                    <option value="Daniela" class="color-gris">Daniela</option>
                    <option value="Nata" class="color-nata-claudia">Nata</option>
                    <option value="Claudia" class="color-nata-claudia">Claudia</option>
                    <option value="Dan" class="color-especial-dan-susan" selected>Dan</option>
                    <option value="Susan" class="color-especial-dan-susan">Susan</option>
                    <option value="Axel" class="color-axel">Axel</option>
                </select>
            </div>
            <button type="submit" class="btn-guardar">GUARDAR REGISTRO</button>
        </form>
    </div>

    <div class="contenedor">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
            <span style="font-weight: bold; color: var(--primary);">HISTORIAL (2 SEMANAS)</span>
            <div style="display: flex; gap: 8px;">
                <a href="https://docs.google.com/spreadsheets/d/1IHm9PobTkGtNdZCIJ8Up7CRRkykwaMdV4NJGdPogEB8/edit" target="_blank" class="btn-excel">📊 Ver Excel</a>
                <button onclick="sincronizar()" id="btnSync" class="btn-sync">🔄 Sincronizar</button>
            </div>
        </div>

        <div class="busqueda-container">
            <input type="text" id="inputBuscar" class="input-busqueda" placeholder="🔍 Buscar por Orden o Institución..." onkeyup="renderTable()">
            <button id="filtroHoy" class="btn-filtro" onclick="toggleFiltroHoy()">📅 Ordenes de Hoy</button>
            <button id="filtroPreparando" class="btn-filtro" onclick="toggleFiltroPreparando()">🛠️ Preparando</button>
            <button id="filtroAtraso" class="btn-filtro" style="background: #b91c1c;" onclick="toggleFiltroAtraso()">⚠️ En Atraso (+2d)</button>
        </div>

        <div style="overflow-x: auto;">
            <table>
                <thead>
                    <tr><th>ORDEN</th><th>FECHA</th><th>INSTITUCIÓN</th><th>RESPONSABLE</th><th style="text-align:center;">¿LISTO?</th></tr>
                </thead>
                <tbody id="tablaBody"></tbody>
            </table>
        </div>
    </div>

    <script>
        const URL_SCRIPT = "https://script.google.com/macros/s/AKfycbzFmaW8FCIHpKUOk6jdbce6qBJQ2vUFd_VepPJXhlVi4Sc0dFaKLIosvrLD2WiFGSh5/exec";
        let datosLocales = JSON.parse(localStorage.getItem('alpromeh_vFinal_v10')) || [];
        let modoFiltro = "todo"; 
        let productoTemporal = "";

        let clicsRapidos = 0;
        let timerClics;

        function getStyleClass(nombre) {
            const map = { 
                "Yanet": "color-yanet", "Danna": "color-danna", "Carmen": "color-carmen", 
                "Daniela": "color-gris", "Nata": "color-nata-claudia", "Claudia": "color-nata-claudia", 
                "Dan": "color-especial-dan-susan", "Susan": "color-especial-dan-susan", "Axel": "color-axel",
                "ANULADA": "color-anulada"
            };
            return map[nombre] || "";
        }

        function aplicarColorUnico(el) { el.className = getStyleClass(el.value); }

        function abrirModalProducto() {
            document.getElementById('modalProducto').style.display = 'flex';
            document.getElementById('inputProducto').focus();
        }

        function cerrarModalProducto() {
            productoTemporal = document.getElementById('inputProducto').value;
            const btn = document.getElementById('btnProducto');
            if(productoTemporal.trim() !== "") {
                btn.classList.add('lleno');
                btn.innerText = "📝";
            } else {
                btn.classList.remove('lleno');
                btn.innerText = "📝";
            }
            document.getElementById('modalProducto').style.display = 'none';
        }

        function toggleFiltroHoy() {
            modoFiltro = (modoFiltro === "hoy") ? "todo" : "hoy";
            actualizarBotones();
            renderTable();
        }

        function toggleFiltroPreparando() {
            modoFiltro = (modoFiltro === "preparando") ? "todo" : "preparando";
            actualizarBotones();
            renderTable();
        }

        function toggleFiltroAtraso() {
            modoFiltro = (modoFiltro === "atraso") ? "todo" : "atraso";
            actualizarBotones();
            renderTable();
        }

        function actualizarBotones() {
            const btnHoy = document.getElementById('filtroHoy');
            const btnPrep = document.getElementById('filtroPreparando');
            const btnAtraso = document.getElementById('filtroAtraso');
            
            btnHoy.className = "btn-filtro" + (modoFiltro === "hoy" ? " activo-hoy" : "");
            btnPrep.className = "btn-filtro" + (modoFiltro === "preparando" ? " activo-preparando" : "");
            btnAtraso.className = "btn-filtro" + (modoFiltro === "atraso" ? " activo-atraso" : "");

            btnHoy.innerText = (modoFiltro === "hoy") ? "❌ Quitar Filtro" : "📅 Ordenes de Hoy";
            btnPrep.innerText = (modoFiltro === "preparando") ? "❌ Quitar Filtro" : "🛠️ Preparando";
            btnAtraso.innerText = (modoFiltro === "atraso") ? "❌ Quitar Filtro" : "⚠️ En Atraso (+2d)";
        }

        function setFechaHoy() {
            const hoy = new Date();
            const offset = hoy.getTimezoneOffset() * 60000;
            document.getElementById('fecha').value = new Date(hoy.getTime() - offset).toISOString().split('T')[0];
        }

        function toggleTheme() {
            const body = document.documentElement;
            body.setAttribute('data-theme', body.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
            clicsRapidos++;
            const mood = document.getElementById('moodFace');
            const emojisRaros = ["👽", "🤖", "🤠", "👻", "🎃", "🐶", "🙈", "🙉", "🙊", "🦄", "🥨", "🍕", "🧨", "🚀", "🦖", "🎭", "🐱", "🦆", "🍩", "🍭", "🎮", "💖", "🐣", "🤑"];
            if (clicsRapidos > 5) {
                const randomEmoji = emojisRaros[Math.floor(Math.random() * emojisRaros.length)];
                mood.innerText = randomEmoji;
                mood.style.transform = "scale(1.7) rotate(20deg)";
                setTimeout(() => { mood.style.transform = "scale(1) rotate(0deg)"; }, 150);
            }
            clearTimeout(timerClics);
            timerClics = setTimeout(() => {
                clicsRapidos = 0;
                const hoyFull = new Date();
                const offset = hoyFull.getTimezoneOffset() * 60000;
                const hoyStr = new Date(hoyFull.getTime() - offset).toISOString().split('T')[0];
                actualizarBarra(hoyStr); 
            }, 2000);
        }

        function calcularDiasHabiles(fechaInicio, fechaFin) {
            let fecha = new Date(fechaInicio);
            let dias = 0;
            while (fecha < fechaFin) {
                fecha.setDate(fecha.getDate() + 1);
                if (fecha.getDay() !== 0 && fecha.getDay() !== 6) {
                    dias++;
                }
            }
            return dias;
        }

window.onload = () => {
    setFechaHoy();
    aplicarColorUnico(document.getElementById('responsableSelect'));
    renderTable();
    sincronizar(); // Primera carga

    // --- AUTO-SYNC CADA 30 SEGUNDOS ---
    setInterval(() => {
        console.log("Sincronizando automáticamente...");
        sincronizarSilencioso(); 
    }, 20000); 
};

        function abrirModalAnular(numOrden) {
            const modal = document.getElementById('modalConfirm');
            const frame = document.getElementById('modalFrame');
            const title = document.getElementById('modalTitle');
            const msg = document.getElementById('modalMsg');
            const btnSi = document.getElementById('btnConfirmarAnular');
            
            const item = datosLocales.find(d => d.orden.toString() === numOrden.toString());
            const esAnulada = item && item.responsable === "ANULADA";

            if (esAnulada) {
                title.innerText = "¿Recuperar Orden?";
                title.style.color = "#10b981";
                frame.style.borderTopColor = "#10b981";
                msg.innerHTML = `La Orden <b>${numOrden}</b> está anulada.<br>¿Deseas restaurarla al sistema?`;
                btnSi.innerText = "RECUPERAR ORDEN";
                btnSi.style.background = "#10b981";
                btnSi.onclick = function() { recuperarOrden(numOrden); cerrarModal(); };
            } else {
                title.innerText = "¿Anular Orden?";
                title.style.color = "#dc2626";
                frame.style.borderTopColor = "#dc2626";
                msg.innerHTML = `¿Estás seguro que deseas anular la<br>Orden de Compra <b>${numOrden}</b>?`;
                btnSi.innerText = "ANULAR ORDEN";
                btnSi.style.background = "#dc2626";
                btnSi.onclick = function() { anularOrden(numOrden); cerrarModal(); };
            }
            modal.style.display = 'flex';
        }

        function cerrarModal() { document.getElementById('modalConfirm').style.display = 'none'; }

        function anularOrden(numOrden) {
            const item = datosLocales.find(d => d.orden.toString() === numOrden.toString());
            const horaActual = new Date().toLocaleTimeString('es-GT', {hour: '2-digit', minute:'2-digit', hour12: false});
            item.movimiento = "ANULADA 🚫";
            item.ultimoMov = "ANULADA";
            item.responsable = "ANULADA";
            item.despachado = false;
            item.hora = horaActual;
            save();
            fetch(URL_SCRIPT, { method: 'POST', mode: 'no-cors', body: JSON.stringify(item) });
            showToast("🚫 Orden " + numOrden + " anulada.");
        }

        function recuperarOrden(numOrden) {
            const item = datosLocales.find(d => d.orden.toString() === numOrden.toString());
            const horaActual = new Date().toLocaleTimeString('es-GT', {hour: '2-digit', minute:'2-digit', hour12: false});
            item.responsable = "Dan"; 
            item.movimiento = "✅ RECUPERADA";
            item.ultimoMov = "RECUPERADA";
            item.hora = horaActual;
            save();
            fetch(URL_SCRIPT, { method: 'POST', mode: 'no-cors', body: JSON.stringify(item) });
            showToast("✅ Orden " + numOrden + " recuperada.");
        }

        function renderTable() {
            const tbody = document.getElementById('tablaBody');
            const busqueda = document.getElementById('inputBuscar').value.toLowerCase();
            tbody.innerHTML = '';
            const hoyFull = new Date();
            const hoyMedianoche = new Date(hoyFull.getFullYear(), hoyFull.getMonth(), hoyFull.getDate());
            const offset = hoyFull.getTimezoneOffset() * 60000;
            const hoyStr = new Date(hoyFull.getTime() - offset).toISOString().split('T')[0];

            let filtrados = datosLocales.filter(item => {
                const coincideBusqueda = item.orden.toString().includes(busqueda) || item.inst.toLowerCase().includes(busqueda);
                const fechaOrden = new Date(item.fecha + "T00:00:00");
                const diasTranscurridos = calcularDiasHabiles(fechaOrden, hoyMedianoche);
                const esAtrasada = !item.despachado && item.responsable !== "Axel" && item.responsable !== "ANULADA" && diasTranscurridos >= 2;
                if (modoFiltro === "hoy") return coincideBusqueda && item.fecha === hoyStr;
                if (modoFiltro === "preparando") return coincideBusqueda && item.responsable === "Axel" && item.fecha === hoyStr;
                if (modoFiltro === "atraso") return coincideBusqueda && esAtrasada;
                return coincideBusqueda;
            });

            filtrados.forEach(item => {
                const tr = document.createElement('tr');
                const esAxel = item.responsable === "Axel";
                const esAnulada = item.responsable === "ANULADA";
                const fechaOrden = new Date(item.fecha + "T00:00:00");
                const diasTranscurridos = calcularDiasHabiles(fechaOrden, hoyMedianoche);
                const esDudaAxel = !item.despachado && esAxel && item.fecha !== hoyStr;
                const esAntigua = !item.despachado && !esAxel && !esAnulada && diasTranscurridos >= 2;

                if (item.despachado) {
                    tr.className = 'fila-despachada';
                } else if (esAnulada) {
                    tr.className = 'color-anulada';
                } else if (esDudaAxel) {
                    tr.className = 'alerta-duda';
                } else if (esAntigua) {
                    tr.className = 'alerta-total'; 
                } else {
                    tr.className = getStyleClass(item.responsable);
                }

                tr.addEventListener('contextmenu', function(e) { e.preventDefault(); abrirModalAnular(item.orden); });

                const textoExtra = esDudaAxel ? " - <b style='color:#e65100; font-size:1.1em;'>¿YA SE DESPACHÓ?</b>" : "";
                let contenidoColumnaListo = "";
                if (esAxel) {
                    contenidoColumnaListo = `<div><input type="checkbox" class="check-axel" ${item.despachado ? 'checked' : ''} onclick="toggle('${item.orden}')"><span class="label-axel">Solo Axel</span></div>`;
                } else if (esAntigua) {
                    contenidoColumnaListo = `<span style="font-size: 1.4rem;">⚠️</span>`;
                }

                const selectBloqueado = esAnulada ? "disabled" : "";
// --- LÓGICA DE DOBLE TOQUE PARA AXEL (SOLO MÓVIL) ---
if (esAxel && !item.despachado) {
    const esMovil = window.matchMedia("(pointer: coarse)").matches;
    if (esMovil) {
        tr.classList.add('fila-axel-movil');
        let ultimoToque = 0;
        tr.addEventListener('touchend', function(e) {
            const tiempoActual = new Date().getTime();
            const diferencia = tiempoActual - ultimoToque;
            if (diferencia < 300 && diferencia > 0) {
                // Doble toque detectado
                tr.classList.add('animar-listo');
                toggle(item.orden); // Marcamos como listo
                showToast("📦 Orden " + item.orden + " lista");
            }
            ultimoToque = tiempoActual;
        });
    }
}

                tr.innerHTML = `
                    <td style="font-weight:bold;" class="${esAntigua ? 'alerta-atraso' : ''}" title="${esAxel ? 'Doble toque para finalizar' : ''}">${item.orden}</td>
                    <td style="font-weight:normal;">${item.fecha.split('-').reverse().join('/')}</td>
                    <td style="font-weight:600; cursor:help;" title="Producto: ${item.producto || 'Sin descripción'}">${item.inst}</td>
                    <td>
                        <select ${selectBloqueado} onchange="cambiarResp('${item.orden}', this.value)" class="${getStyleClass(item.responsable)}" style="cursor:${esAnulada ? 'not-allowed' : 'pointer'}; border-radius:4px; padding:4px; font-weight:bold; border:1px solid rgba(0,0,0,0.1);">
                            ${esAnulada ? '<option value="ANULADA" selected>🚫 ANULADA</option>' : ''}
                            <option value="Yanet" ${item.responsable==='Yanet'?'selected':''}>Yanet</option>
                            <option value="Danna" ${item.responsable==='Danna'?'selected':''}>Danna</option>
                            <option value="Carmen" ${item.responsable==='Carmen'?'selected':''}>Carmen</option>
                            <option value="Daniela" ${item.responsable==='Daniela'?'selected':''}>Daniela</option>
                            <option value="Nata" ${item.responsable==='Nata'?'selected':''}>Nata</option>
                            <option value="Claudia" ${item.responsable==='Claudia'?'selected':''}>Claudia</option>
                            <option value="Dan" ${item.responsable==='Dan'?'selected':''}>Dan</option>
                            <option value="Susan" ${item.responsable==='Susan'?'selected':''}>Susan</option>
                            <option value="Axel" ${item.responsable==='Axel'?'selected':''}>Axel</option>
                        </select>
                        <br><small style="opacity:0.8; font-weight:normal;">🕒 ${item.hora} <b>${item.movimiento ? ' - ' + item.movimiento : ''}${textoExtra}</b></small>
                    </td>
                    <td style="text-align:center;">${esAnulada ? '' : contenidoColumnaListo}</td>
                `;
                tbody.appendChild(tr);
            });
            actualizarBarra(hoyStr);
        }

        function actualizarBarra(hoyStr) {
            const hoyAxel = datosLocales.filter(d => d.fecha === hoyStr && d.responsable === "Axel");
            const despachadas = hoyAxel.filter(d => d.despachado).length;
            const pct = hoyAxel.length ? (despachadas / hoyAxel.length) * 100 : 0;
            document.getElementById('barraProgreso').style.width = pct + "%";
            if(clicsRapidos <= 5) {
                document.getElementById('moodFace').innerText = pct === 100 ? "😃" : pct >= 66 ? "😁" : pct >= 33 ? "🙂" : "😟";
            }
        }

    document.getElementById('formOrdenes').onsubmit = function(e) {
    e.preventDefault();
    
    const btnGuardar = document.querySelector('.btn-guardar');
    const formCard = document.getElementById('contenedorForm');
    
    // --- ESCUDO ANTI-DUPLICADOS ---
    if (btnGuardar.disabled) return; 
    
    const num = document.getElementById('orden').value;
    const ordenPrevia = datosLocales.find(d => d.orden.toString() === num.toString());
    const yaExiste = !!ordenPrevia;

    if(yaExiste) {
        showToast("⚙️ La OC. " + num + " se está actualizando...", "warning");
        formCard.classList.add('resaltar-actualizacion');
    }

    // Bloqueo visual y lógico inmediato
    btnGuardar.disabled = true;
    btnGuardar.innerText = "REGISTRANDO...";
    btnGuardar.style.opacity = "0.5";
    btnGuardar.style.cursor = "not-allowed";

    const horaActual = new Date().toLocaleTimeString('es-GT', {hour: '2-digit', minute:'2-digit', hour12: false});
    const fechaActual = document.getElementById('fecha').value;
    const fechaARegistrar = yaExiste ? ordenPrevia.fecha : fechaActual;
    const horaARegistrar = yaExiste ? ordenPrevia.hora : horaActual;

    // Limpiamos versión vieja si existe para evitar duplicados en la lista local
    datosLocales = datosLocales.filter(d => d.orden.toString() !== num.toString());

    const payload = {
        orden: num, 
        fecha: fechaARegistrar, 
        inst: document.getElementById('institucion').value, 
        pers: document.getElementById('persona').value,
        responsable: document.getElementById('responsableSelect').value, 
        despachado: false,
        hora: horaARegistrar, 
        ultimaHora: horaARegistrar, 
        movimiento: "Ingreso/Edición: " + document.getElementById('persona').value, 
        ultimoMov: "Ingreso/Edición: " + document.getElementById('persona').value,
        producto: productoTemporal 
    };

    datosLocales.unshift(payload);
    save(); 

    fetch(URL_SCRIPT, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) })
    .then(() => {
        // Limpieza de interfaz
        this.reset(); 
        setFechaHoy(); 
        productoTemporal = ""; 
        document.getElementById('btnProducto').classList.remove('lleno');
        document.getElementById('btnProducto').innerText = "📝";
        aplicarColorUnico(document.getElementById('responsableSelect'));
        
        if(!yaExiste) showToast("✅ OC. " + num + " guardada correctamente");
    })
    .catch(err => {
        showToast("❌ Error de red, verifique conexión", true);
    })
    .finally(() => {
        // El "superpoder": el botón se libera solo después de terminar el proceso
        // Agregamos 500ms de seguridad para evitar clics fantasma
        setTimeout(() => {
            formCard.classList.remove('resaltar-actualizacion');
            btnGuardar.disabled = false;
            btnGuardar.innerText = "GUARDAR REGISTRO";
            btnGuardar.style.opacity = "1";
            btnGuardar.style.cursor = "pointer";
        }, 500);
    });
};

        function toggle(orden) {
            const item = datosLocales.find(d => d.orden === orden);
            item.despachado = !item.despachado;
            if (item.despachado) {
                item.ultimaHora = item.hora; 
                item.movimiento = "LISTO ✅";
                item.hora = new Date().toLocaleTimeString('es-GT', {hour: '2-digit', minute:'2-digit', hour12: false});
            } else {
                item.movimiento = item.ultimoMov || ("Ingresada por " + item.pers);
                item.hora = item.ultimaHora || item.hora; 
            }
            save();
            fetch(URL_SCRIPT, { method: 'POST', mode: 'no-cors', body: JSON.stringify(item) });
        }

        function cambiarResp(orden, nuevo) {
            const item = datosLocales.find(d => d.orden === orden);
            const horaActual = new Date().toLocaleTimeString('es-GT', {hour: '2-digit', minute:'2-digit', hour12: false});
            const track = "De: " + item.responsable + " Para: " + nuevo;
            item.responsable = nuevo;
            item.movimiento = track; 
            item.ultimoMov = track; 
            item.hora = horaActual;
            item.ultimaHora = horaActual; 
            save();
            fetch(URL_SCRIPT, { method: 'POST', mode: 'no-cors', body: JSON.stringify(item) });
        }

        function save() {
            localStorage.setItem('alpromeh_vFinal_v10', JSON.stringify(datosLocales));
            renderTable();
        }

        async function sincronizar() {
            const btn = document.getElementById('btnSync');
            btn.innerText = "...";
            try {
                const r = await fetch(URL_SCRIPT);
                const d = await r.json();
                if(Array.isArray(d)) { datosLocales = d; save(); }
            } catch(e) { showToast("Error de conexión", true); }
            btn.innerText = "🔄 Sincronizar";
        }

// --- SINCRONIZACION SILENCIOSA ---
async function sincronizarSilencioso() {
    try {
        const r = await fetch(URL_SCRIPT);
        const d = await r.json();
        if(Array.isArray(d)) { 
            // La magia: solo guarda y refresca si hay algo nuevo en la nube
            if (JSON.stringify(d) !== JSON.stringify(datosLocales)) {
                datosLocales = d; 
                localStorage.setItem('alpromeh_vFinal_v10', JSON.stringify(datosLocales));
                renderTable(); 
                console.log("Sistema actualizado automáticamente.");
            }
        }
    } catch(e) { 
        // No hace nada si falla, para no molestar al usuario
        console.log("Auto-sync falló (posible falta de internet)");
    }
}

        function showToast(msj, tipo) {
            const toast = document.getElementById('toast');
            toast.innerText = msj;
            toast.className = ''; // Limpiamos clases previas
            
            if (tipo === true) {
                toast.style.background = "#dc2626"; // Rojo error
                toast.style.display = "block";
            } else if (tipo === "warning") {
                toast.id = "toast";
                toast.className = "warning"; // Usará el amarillo #ffc400 del CSS
            } else {
                toast.style.background = "#10b981"; // Verde éxito
                toast.style.display = "block";
            }
            
            setTimeout(() => { 
                toast.style.display = "none"; 
                toast.className = "";
            }, 3000);
        }

        document.getElementById('triggerHuevo').addEventListener('dblclick', function() {
            window.open("https://d-an13.github.io/alpromeh-registro/alprogame.html", "_blank");
        });
    </script>
