<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ALPROMINAS — Minijuegos</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap');

        :root {
            --bg0: #070b14;
            --bg1: #0f172a;
            --panel: rgba(22, 32, 52, 0.92);
            --panel-border: rgba(255,255,255,0.1);
            --cell: #2a3a52;
            --cell-top: #3d516e;
            --cell-revealed: #151f30;
            --rojo: #ff3b4a;
            --verde: #12d18e;
            --celeste: #22d3ee;
            --oro: #fbbf24;
            --violeta: #a78bfa;
            --sombra: 0 20px 50px rgba(0,0,0,0.55);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        html, body { margin: 0; height: 100%; overflow: hidden; }
        body {
            font-family: 'Nunito', 'Segoe UI', system-ui, sans-serif;
            color: #f8fafc;
            display: flex; justify-content: center; align-items: center;
            background: var(--bg0);
            transition: background 0.45s ease;
        }
        body.mode-facil {
            background:
                radial-gradient(ellipse 70% 50% at 50% 0%, rgba(59,130,246,0.28), transparent 55%),
                radial-gradient(ellipse 40% 40% at 90% 90%, rgba(239,68,68,0.1), transparent 50%),
                linear-gradient(165deg, #0f172a, #070b14);
        }
        body.mode-medio {
            background:
                radial-gradient(ellipse 70% 50% at 50% 0%, rgba(16,185,129,0.25), transparent 55%),
                radial-gradient(ellipse 40% 40% at 10% 90%, rgba(251,191,36,0.1), transparent 50%),
                linear-gradient(165deg, #0a1f18, #070b14);
        }
        body.mode-dificil {
            background:
                radial-gradient(ellipse 70% 50% at 50% 0%, rgba(251,191,36,0.22), transparent 55%),
                radial-gradient(ellipse 40% 40% at 80% 80%, rgba(167,139,250,0.1), transparent 50%),
                linear-gradient(165deg, #1a1408, #070b14);
        }

        /* partículas de fondo decorativas */
        body::before {
            content: '';
            position: fixed; inset: 0; pointer-events: none; z-index: 0;
            background-image:
                radial-gradient(1.5px 1.5px at 20% 30%, rgba(255,255,255,0.15), transparent),
                radial-gradient(1.5px 1.5px at 70% 60%, rgba(34,211,238,0.2), transparent),
                radial-gradient(1px 1px at 40% 80%, rgba(251,191,36,0.2), transparent),
                radial-gradient(1.5px 1.5px at 85% 20%, rgba(167,139,250,0.18), transparent);
            background-size: 100% 100%;
            animation: twinkle 8s ease-in-out infinite alternate;
        }
        @keyframes twinkle {
            from { opacity: 0.5; }
            to { opacity: 1; }
        }

        #main-layout {
            position: relative; z-index: 1;
            display: flex; width: 100%; padding: 14px;
            align-items: center; justify-content: center; gap: 16px;
        }

        /* ========== TIENDA ========== */
        #shop-container {
            display: flex; flex-direction: column; gap: 6px;
            background: var(--panel);
            padding: 12px 10px;
            border-radius: 22px;
            border: 1px solid var(--panel-border);
            box-shadow: var(--sombra), inset 0 1px 0 rgba(255,255,255,0.06);
            backdrop-filter: blur(16px);
            position: fixed; left: 10px; top: 50%; transform: translateY(-50%);
            z-index: 5;
            transition: opacity 0.3s, transform 0.3s;
            max-height: none;
            overflow: hidden;
        }
        #shop-container.hidden {
            opacity: 0; pointer-events: none;
            transform: translateY(-50%) translateX(-12px) scale(0.96);
            width: 0; padding: 0; border: none; overflow: hidden;
        }
        .shop-title {
            font-size: 0.62rem; font-weight: 800; letter-spacing: 1.5px;
            text-transform: uppercase; color: rgba(255,255,255,0.4);
            text-align: center; margin-bottom: 2px;
        }
        .shop-item {
            display: flex; flex-direction: column; align-items: center;
            cursor: pointer; transition: 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            padding: 7px 6px; border-radius: 14px; min-width: 84px;
            border: 2px solid transparent;
            background: rgba(255,255,255,0.03);
        }
        .shop-item:hover:not(.disabled) {
            background: rgba(255,255,255,0.1);
            transform: translateY(-3px) scale(1.05);
            border-color: rgba(34,211,238,0.35);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }
        .shop-item:active:not(.disabled) { transform: scale(0.96); }
        .shop-item.disabled {
            opacity: 0.32; cursor: not-allowed; filter: grayscale(0.9);
        }
        .shop-item.owned {
            border-color: var(--verde);
            background: rgba(18,209,142,0.12);
            box-shadow: 0 0 16px rgba(18,209,142,0.2);
        }
        .shop-item .emoji {
            font-size: 1.55rem; line-height: 1.2;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
        }
        .shop-item .price-tag {
            font-size: 0.68rem; font-weight: 800; color: var(--oro);
            margin-top: 4px; text-shadow: 0 0 8px rgba(251,191,36,0.35);
        }
        .shop-item .desc {
            font-size: 0.55rem; opacity: 0.85; text-transform: uppercase;
            margin-top: 3px; letter-spacing: 0.5px; text-align: center; font-weight: 700;
        }

        /* ========== PANEL JUEGO ========== */
        #game-container {
            background: var(--panel);
            padding: 16px 20px 18px;
            border-radius: 28px;
            box-shadow: var(--sombra), inset 0 1px 0 rgba(255,255,255,0.07);
            border: 1px solid var(--panel-border);
            text-align: center; position: relative;
            display: flex; flex-direction: column; justify-content: center;
            max-height: calc(100vh - 20px); margin-left: 120px; min-width: 310px;
            overflow: hidden;
            backdrop-filter: blur(20px);
            animation: panelIn 0.45s cubic-bezier(0.34, 1.2, 0.64, 1);
        }
        @keyframes panelIn {
            from { opacity: 0; transform: translateY(16px) scale(0.97); }
            to { opacity: 1; transform: none; }
        }

        #points-display {
            font-size: 1.45rem; font-weight: 900; color: var(--oro);
            margin-bottom: 0; letter-spacing: 0.5px;
            transition: color 0.3s, text-shadow 0.3s, transform 0.2s;
            text-shadow: 0 0 20px rgba(251,191,36,0.35);
        }
        #points-display.pop { animation: scorePop 0.35s ease; }
        @keyframes scorePop {
            0% { transform: scale(1); }
            40% { transform: scale(1.18); }
            100% { transform: scale(1); }
        }
        #points-display.mode-energy {
            color: var(--celeste);
            text-shadow: 0 0 18px rgba(34,211,238,0.5);
        }
        #points-display.mode-lights {
            color: var(--oro);
            text-shadow: 0 0 16px rgba(251,191,36,0.45);
        }
        #points-label {
            font-size: 0.58rem; font-weight: 800; letter-spacing: 1.5px;
            text-transform: uppercase; opacity: 0.4; margin-bottom: 8px;
        }

        .multiplicador-wrapper {
            margin-bottom: 10px; width: 100%; transition: opacity 0.4s;
        }
        .multiplicador-wrapper.hidden { display: none !important; }
        #multi-text {
            font-size: 0.62rem; font-weight: 900; color: var(--oro);
            text-transform: uppercase; letter-spacing: 0.5px;
        }
        .multiplicador-container {
            width: 100%; height: 6px; background: rgba(255,255,255,0.08);
            border-radius: 99px; margin-top: 4px; overflow: hidden;
            border: 1px solid rgba(255,255,255,0.06);
        }
        #barra-progreso {
            width: 100%; height: 100%;
            background: linear-gradient(90deg, #f59e0b, #fde68a, #fbbf24);
            background-size: 200% 100%;
            animation: shimmer 1.5s linear infinite;
            transition: width 0.1s linear;
            border-radius: 99px;
            box-shadow: 0 0 10px rgba(251,191,36,0.5);
        }
        @keyframes shimmer {
            0% { background-position: 100% 0; }
            100% { background-position: -100% 0; }
        }

        .header-icon {
            font-size: 2rem; margin-bottom: 2px;
            filter: drop-shadow(0 4px 12px rgba(0,0,0,0.35));
            animation: iconFloat 3s ease-in-out infinite;
        }
        @keyframes iconFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }
        #main-title {
            margin: 0 0 12px; font-size: 1.05rem; letter-spacing: 3px;
            font-weight: 900; text-transform: uppercase;
            background: linear-gradient(135deg, #fff 0%, #94a3b8 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .menu-dificultad {
            margin-bottom: 12px; display: flex; gap: 5px; justify-content: center;
            background: rgba(0,0,0,0.35); padding: 5px; border-radius: 16px;
            flex-wrap: wrap; border: 1px solid rgba(255,255,255,0.05);
        }
        .btn-nivel {
            border: none; padding: 7px 14px; border-radius: 12px;
            color: rgba(255,255,255,0.4); font-weight: 800; cursor: pointer;
            background: transparent; transition: 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            font-size: 0.72rem; font-family: inherit; letter-spacing: 0.3px;
        }
        .btn-nivel:hover:not(.active) { color: rgba(255,255,255,0.75); background: rgba(255,255,255,0.06); }
        .btn-nivel.active { color: #fff; transform: scale(1.04); }

        .tablero-scroll-area {
            width: 100%;
            flex: 1 1 auto;
            min-height: 0;
            overflow: hidden;
            margin: 4px 0 6px; display: flex; justify-content: center; align-items: center;
        }
        #tablero {
            display: grid; gap: 3px; margin: 0 auto; padding: 10px;
            background: rgba(0,0,0,0.35);
            border-radius: 18px; width: max-content;
            border: 1px solid rgba(255,255,255,0.05);
            box-shadow: inset 0 2px 12px rgba(0,0,0,0.3);
            transform-origin: center center;
        }
        .celda.roca {
            background: linear-gradient(160deg, #64748b, #475569) !important;
            cursor: not-allowed;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.4);
        }
        .celda.roca.golpe { animation: rockHit 0.35s ease; }
        @keyframes rockHit {
            0%,100%{transform:scale(1)} 40%{transform:scale(0.9)} 70%{transform:scale(1.05)}
        }
        .celda.hint-glow {
            box-shadow: 0 0 0 2px #22d3ee, 0 0 14px rgba(34,211,238,0.55) !important;
        }
        .btn-accion-luces {
            border: 1px solid rgba(255,255,255,0.15);
            background: rgba(255,255,255,0.06);
            color: #e2e8f0; font-weight: 800; font-size: 0.68rem;
            padding: 5px 12px; border-radius: 99px; cursor: pointer;
            font-family: inherit; margin-bottom: 6px;
        }
        .btn-accion-luces:hover { border-color: #fbbf24; color: #fbbf24; }
        .btn-accion-luces.hidden { display: none; }

        .celda {
            display: flex; align-items: center; justify-content: center;
            background: linear-gradient(160deg, var(--cell-top) 0%, var(--cell) 100%);
            border-radius: 10px; cursor: pointer;
            transition: transform 0.12s, filter 0.15s;
            user-select: none; font-weight: 900; font-size: 0.88rem;
            box-shadow:
                0 3px 0 rgba(0,0,0,0.35),
                inset 0 1px 0 rgba(255,255,255,0.12);
            position: relative;
        }
        .celda:hover:not(.revelada):not(.luz-on) {
            filter: brightness(1.15);
            transform: translateY(-2px);
            box-shadow: 0 5px 0 rgba(0,0,0,0.3), 0 6px 14px rgba(0,0,0,0.25);
        }
        .celda:active:not(.revelada) {
            transform: translateY(2px);
            box-shadow: 0 1px 0 rgba(0,0,0,0.3);
        }
        .celda.revelada {
            background: var(--cell-revealed);
            cursor: default; transform: none;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.4);
            animation: revealPop 0.25s cubic-bezier(0.34, 1.4, 0.64, 1);
        }
        @keyframes revealPop {
            0% { transform: scale(0.6); opacity: 0.5; }
            100% { transform: scale(1); opacity: 1; }
        }
        .celda.mina {
            background: linear-gradient(160deg, #ff6b6b, var(--rojo)) !important;
            box-shadow: 0 0 18px rgba(255,59,74,0.55), 0 3px 0 #b91c1c !important;
            animation: boomShake 0.5s ease;
        }
        @keyframes boomShake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-4px) rotate(-3deg); }
            40% { transform: translateX(4px) rotate(3deg); }
            60% { transform: translateX(-3px); }
            80% { transform: translateX(3px); }
        }
        .celda.flash-red {
            background: var(--rojo) !important;
            box-shadow: 0 0 20px var(--rojo) !important;
            animation: flashPulse 0.4s ease 3;
        }
        @keyframes flashPulse {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(1.6); }
        }
        .celda.tesoro {
            background: linear-gradient(160deg, #34d399, var(--verde)) !important;
            box-shadow: 0 0 24px rgba(18,209,142,0.6) !important;
            animation: treasureGlow 0.7s ease infinite alternate;
            font-size: 1.2rem;
        }
        @keyframes treasureGlow {
            from { transform: scale(1); filter: brightness(1); }
            to { transform: scale(1.06); filter: brightness(1.2); }
        }
        .celda.luz-on {
            background: linear-gradient(160deg, #fde68a, #fbbf24) !important;
            box-shadow:
                0 0 22px rgba(251,191,36,0.65),
                inset 0 0 12px rgba(255,255,255,0.45) !important;
            border: 1px solid rgba(255,255,255,0.55);
            animation: lightOn 0.2s ease;
        }
        @keyframes lightOn {
            from { transform: scale(0.9); filter: brightness(0.7); }
            to { transform: scale(1); filter: brightness(1); }
        }

        /* ========== MODAL ========== */
        #modal-instrucciones {
            position: absolute; inset: 0; z-index: 100;
            display: none; justify-content: center; align-items: center;
            background: rgba(7, 11, 20, 0.65);
            backdrop-filter: blur(14px);
            border-radius: 28px;
        }
        #modal-instrucciones.visible { display: flex; animation: fadeIn 0.25s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .modal-content {
            text-align: center; padding: 32px 28px;
            background: linear-gradient(165deg, rgba(36,48,72,0.98), rgba(18,26,42,0.98));
            border-radius: 24px; border: 1px solid rgba(255,255,255,0.12);
            box-shadow: 0 24px 48px rgba(0,0,0,0.5), 0 0 40px rgba(34,211,238,0.08);
            max-width: 300px;
            animation: modalBounce 0.4s cubic-bezier(0.34, 1.4, 0.64, 1);
        }
        @keyframes modalBounce {
            from { opacity: 0; transform: scale(0.85) translateY(12px); }
            to { opacity: 1; transform: none; }
        }
        .modal-content .modal-icon {
            font-size: 2.4rem; margin-bottom: 8px;
            filter: drop-shadow(0 4px 12px rgba(0,0,0,0.3));
        }
        .modal-content h2 {
            letter-spacing: 2.5px; margin: 0 0 6px; font-size: 1.15rem; font-weight: 900;
        }
        .modal-content p {
            font-size: 0.84rem; opacity: 0.88; margin: 12px 0 20px;
            line-height: 1.5; color: rgba(255,255,255,0.85); font-weight: 600;
        }
        .btn-jugar {
            background: linear-gradient(135deg, #22d3ee, #06b6d4);
            color: #0f172a; border: none;
            padding: 12px 40px; font-size: 0.95rem; font-weight: 900;
            border-radius: 50px; cursor: pointer; transition: 0.25s;
            text-transform: uppercase; letter-spacing: 1.5px;
            font-family: inherit;
            box-shadow: 0 6px 24px rgba(34, 211, 238, 0.4), 0 3px 0 #0891b2;
        }
        .btn-jugar:hover {
            transform: translateY(-2px) scale(1.04);
            box-shadow: 0 10px 32px rgba(34, 211, 238, 0.55), 0 4px 0 #0891b2;
        }
        .btn-jugar:active {
            transform: translateY(2px);
            box-shadow: 0 2px 12px rgba(34, 211, 238, 0.3), 0 1px 0 #0891b2;
        }

        /* ========== OVERLAYS ========== */
        .overlay {
            display: none; position: absolute; inset: 0;
            border-radius: 28px; flex-direction: column;
            justify-content: center; align-items: center; z-index: 20;
            backdrop-filter: blur(12px); background: rgba(7,11,20,0.6);
        }
        .overlay.visible {
            display: flex;
            animation: fadeIn 0.3s ease;
        }
        #pantalla-boom h1 {
            font-size: 2.6rem; margin: 0; color: var(--rojo);
            text-shadow: 0 0 30px rgba(255,59,74,0.7);
            animation: boomText 0.5s cubic-bezier(0.34, 1.5, 0.64, 1);
            font-weight: 900;
        }
        @keyframes boomText {
            0% { transform: scale(0.3) rotate(-8deg); opacity: 0; }
            100% { transform: scale(1) rotate(0); opacity: 1; }
        }
        #pantalla-victoria h1 {
            font-size: 2.1rem; margin: 0; color: var(--verde);
            text-shadow: 0 0 28px rgba(18,209,142,0.6);
            animation: winText 0.55s cubic-bezier(0.34, 1.5, 0.64, 1);
            font-weight: 900;
        }
        @keyframes winText {
            0% { transform: scale(0.4) translateY(20px); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .btn-retry, .btn-next {
            border: none; padding: 12px 28px; font-size: 0.88rem;
            font-weight: 900; border-radius: 50px; cursor: pointer; margin-top: 16px;
            transition: 0.2s; font-family: inherit; letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        .btn-retry {
            background: linear-gradient(135deg, #22d3ee, #06b6d4);
            color: #0f172a;
            box-shadow: 0 4px 16px rgba(34,211,238,0.35), 0 3px 0 #0891b2;
        }
        .btn-next {
            background: linear-gradient(135deg, #34d399, #10b981);
            color: white;
            box-shadow: 0 4px 16px rgba(16,185,129,0.35), 0 3px 0 #059669;
        }
        .btn-retry:hover, .btn-next:hover { transform: translateY(-2px) scale(1.04); }
        .btn-retry:active, .btn-next:active { transform: translateY(2px); }

        .regalo-box {
            margin-top: 14px;
            background: rgba(255,255,255,0.06);
            padding: 14px 16px; border-radius: 18px; max-width: 240px;
            border: 1px solid rgba(255,255,255,0.08);
            animation: modalBounce 0.45s 0.15s both;
        }
        .regalo-box p {
            font-size: 0.7rem; margin: 0 0 10px; color: var(--oro);
            font-weight: 800; letter-spacing: 0.8px; text-transform: uppercase;
        }
        .regalo-ops { display: flex; gap: 10px; justify-content: center; }
        .regalo-ops button {
            background: rgba(34,211,238,0.12);
            border: 2px solid rgba(34,211,238,0.4);
            color: white; padding: 10px 14px; border-radius: 14px;
            font-size: 1.25rem; cursor: pointer; transition: 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .regalo-ops button:hover {
            background: rgba(34,211,238,0.3);
            transform: scale(1.12) translateY(-2px);
            box-shadow: 0 6px 16px rgba(34,211,238,0.25);
        }
        .regalo-ops button.taken { opacity: 0.3; pointer-events: none; transform: none; }

        /* Toast */
        .toast {
            position: absolute; bottom: 18px; left: 50%;
            transform: translateX(-50%) translateY(24px);
            background: rgba(15,23,42,0.96);
            border: 1px solid rgba(255,255,255,0.14);
            padding: 10px 18px; border-radius: 14px;
            font-size: 0.78rem; font-weight: 700;
            opacity: 0; pointer-events: none; transition: 0.3s cubic-bezier(0.34, 1.2, 0.64, 1);
            z-index: 50; white-space: nowrap;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
        }
        .toast.show {
            opacity: 1; transform: translateX(-50%) translateY(0);
        }

        /* Confeti canvas */
        #confetti-canvas {
            position: absolute; inset: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 25; border-radius: 28px;
        }

        /* Shake del panel al perder */
        #game-container.shake {
            animation: panelShake 0.5s ease;
        }
        @keyframes panelShake {
            0%, 100% { transform: translateX(0); }
            15% { transform: translateX(-8px); }
            30% { transform: translateX(8px); }
            45% { transform: translateX(-6px); }
            60% { transform: translateX(6px); }
            75% { transform: translateX(-3px); }
        }

        @media (max-width: 800px) {
            html, body { overflow: auto; height: auto; }
            #main-layout { flex-direction: column; padding: 8px; }
            #shop-container {
                position: relative; left: 0; top: 0; transform: none;
                flex-direction: row; flex-wrap: wrap; order: 2; margin-top: 12px;
                max-height: none; justify-content: center; width: auto;
            }
            #shop-container.hidden { transform: none; width: 0; }
            #game-container { order: 1; width: 98%; margin-left: 0; max-height: none; overflow: visible; }
            body { align-items: flex-start; padding: 8px 0; }
        }
    </style>
</head>
<body>

<div id="main-layout">
    <div id="shop-container" class="hidden">
        <div class="shop-title">Tienda</div>
        <div class="shop-item" id="item-revelar" onclick="comprarItem('revelar')" title="Revela las minas un momento">
            <span class="emoji">👁️</span>
            <span class="price-tag">1500 ⭐</span>
            <span class="desc">Ver minas</span>
        </div>
        <div class="shop-item" id="item-escudo" onclick="comprarItem('escudo')" title="Sobrevives a 1 mina">
            <span class="emoji">🛡️</span>
            <span class="price-tag">3000 ⭐</span>
            <span class="desc">1 protección</span>
        </div>
        <div class="shop-item" id="item-auditoria" onclick="comprarItem('auditoria')" title="Marca 3 minas al azar">
            <span class="emoji">🚩</span>
            <span class="price-tag">1000 ⭐</span>
            <span class="desc">3 banderas</span>
        </div>
        <div class="shop-item" id="item-pista" onclick="comprarItem('pista')" title="Abre 1 casilla segura">
            <span class="emoji">🔍</span>
            <span class="price-tag">1200 ⭐</span>
            <span class="desc">1 pista</span>
        </div>
        <div class="shop-item" id="item-tiempo" onclick="comprarItem('tiempo')" title="Reinicia el bono x2">
            <span class="emoji">⏱️</span>
            <span class="price-tag">800 ⭐</span>
            <span class="desc">Más tiempo</span>
        </div>
        <div class="shop-item" id="item-barrido" onclick="comprarItem('barrido')" title="Abre varias casillas seguras">
            <span class="emoji">✨</span>
            <span class="price-tag">2500 ⭐</span>
            <span class="desc">Barrido</span>
        </div>
    </div>

    <div id="game-container">
        <canvas id="confetti-canvas"></canvas>

        <div id="modal-instrucciones">
            <div class="modal-content">
                <div class="modal-icon" id="modal-icon">💣</div>
                <h2 id="modal-titulo"></h2>
                <p id="modal-desc"></p>
                <button class="btn-jugar" onclick="empezarPartida()">¡Jugar!</button>
            </div>
        </div>

        <div id="points-display"><span id="coin-icon">⭐</span> <span id="puntos-val">0</span></div>
        <div id="points-label">Estrellas</div>

        <div class="multiplicador-wrapper hidden" id="multi-wrapper">
            <span id="multi-text">⚡ Bono de tiempo · ⭐ ×2</span>
            <div class="multiplicador-container"><div id="barra-progreso"></div></div>
        </div>

        <div class="header-icon" id="header-icon">💣</div>
        <h2 id="main-title">ALPROMINAS</h2>

        <div class="menu-dificultad">
            <button class="btn-nivel active" id="btn-facil" onclick="seleccionarModo('facil', this)">💣 Buscaminas</button>
            <button class="btn-nivel" id="btn-medio" onclick="seleccionarModo('medio', this)">💎 Tesoro</button>
            <button class="btn-nivel" id="btn-dificil" onclick="seleccionarModo('dificil', this)">💡 Luces</button>
        </div>

        <button type="button" id="btn-pista-luces" class="btn-accion-luces hidden" onclick="pistaLuces()">💡 Pista (te marca una casilla clave)</button>
        <div class="tablero-scroll-area">
            <div id="tablero"></div>
        </div>

        <div id="pantalla-boom" class="overlay">
            <h1 id="boom-text">¡BOOM!</h1>
            <button class="btn-retry" onclick="reintentar()">Reintentar</button>
        </div>

        <div id="pantalla-victoria" class="overlay">
            <h1>¡Ganaste! 🎉</h1>
            <div id="regalos-seccion" class="regalo-box" style="display:none;">
                <p>Elige un bono para la próxima</p>
                <div class="regalo-ops">
                    <button id="regalo-revelar" onclick="reclamarRegalo('revelar')" title="Ver minas">👁️</button>
                    <button id="regalo-escudo" onclick="reclamarRegalo('escudo')" title="Escudo">🛡️</button>
                    <button id="regalo-auditoria" onclick="reclamarRegalo('auditoria')" title="3 banderas">🚩</button>
                </div>
            </div>
            <button class="btn-next" onclick="reintentar()">Siguiente</button>
        </div>

        <div id="toast" class="toast"></div>
    </div>
</div>

<script>
/* =========================================================
   ALPROMINAS — 3 juegos independientes + polish visual
   ========================================================= */

const MODOS = {
    facil: {
        nombre: 'ALPROMINAS',
        titulo: 'BUSCAMINAS',
        desc: 'Abre todas las celdas seguras sin tocar minas. Clic derecho = bandera. ¡La tienda te salva!',
        icon: '💣',
        colorBtn: '#3b82f6',
        colorTitulo: '#22d3ee',
        label: 'Estrellas',
        coin: '⭐'
    },
    medio: {
        nombre: 'BUSCATESORO',
        titulo: 'TESORO OCULTO',
        desc: 'Encuentra el 💎. Las 🪨 rocas restan 2 movimientos. El número es la distancia. Rojo = cerca.',
        icon: '💎',
        colorBtn: '#10b981',
        colorTitulo: '#6ee7b7',
        label: 'Movimientos',
        coin: '⚡'
    },
    dificil: {
        nombre: 'LUCES FUERA',
        titulo: 'LUCES FUERA',
        desc: 'Apaga todas. Cada toque cambia esa casilla y sus vecinas. Si te trabas, usa Pista.',
        icon: '💡',
        colorBtn: '#fbbf24',
        colorTitulo: '#fcd34d',
        label: 'Luces on',
        coin: '💡'
    }
};

const estado = {
    facil: {
        puntos: 0,
        itemsUsados: { revelar: false, escudo: false, auditoria: false, pista: false, tiempo: false, barrido: false },
        itemsPendientes: { revelar: false, escudo: false, auditoria: false, pista: false, tiempo: false, barrido: false },
        tieneEscudo: false
    },
    medio: { movimientos: 10 },
    dificil: {}
};

let modoActual = 'facil';
let tableroLogico = [];
let filas = 8, cols = 8, minas = 10;
let juegoTerminado = false;
let partidaActiva = false;
let multiplicadorActivo = false;
let timerMulti = null;
let tesoroF = 0, tesoroC = 0;
let lucesSolucion = null;


function ajustarEscalaTablero() {
    const wrap = document.querySelector('.tablero-scroll-area');
    const tab = document.getElementById('tablero');
    if (!wrap || !tab || !tab.children.length) return;
    tab.style.transform = 'scale(1)';
    const aw = wrap.clientWidth - 4, ah = wrap.clientHeight - 4;
    const nw = tab.scrollWidth, nh = tab.scrollHeight;
    if (nw < 1 || nh < 1) return;
    const s = Math.min(1, aw / nw, ah / nh);
    tab.style.transform = 'scale(' + s + ')';
}
window.addEventListener('resize', () => ajustarEscalaTablero());

/* ---------- Confetti ---------- */
function lanzarConfeti() {
    const canvas = document.getElementById('confetti-canvas');
    const gc = document.getElementById('game-container');
    canvas.width = gc.clientWidth;
    canvas.height = gc.clientHeight;
    const ctx = canvas.getContext('2d');
    const colors = ['#22d3ee', '#fbbf24', '#12d18e', '#a78bfa', '#f472b6', '#fff'];
    const pieces = Array.from({ length: 70 }, () => ({
        x: canvas.width * 0.5 + (Math.random() - 0.5) * 40,
        y: canvas.height * 0.35,
        vx: (Math.random() - 0.5) * 14,
        vy: -Math.random() * 10 - 4,
        w: Math.random() * 7 + 3,
        h: Math.random() * 5 + 2,
        color: colors[Math.floor(Math.random() * colors.length)],
        rot: Math.random() * Math.PI,
        vr: (Math.random() - 0.5) * 0.3,
        life: 1
    }));

    let frame = 0;
    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        let alive = false;
        pieces.forEach(p => {
            p.vy += 0.28;
            p.x += p.vx;
            p.y += p.vy;
            p.rot += p.vr;
            p.life -= 0.012;
            if (p.life <= 0) return;
            alive = true;
            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate(p.rot);
            ctx.globalAlpha = Math.max(0, p.life);
            ctx.fillStyle = p.color;
            ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
            ctx.restore();
        });
        frame++;
        if (alive && frame < 120) requestAnimationFrame(draw);
        else ctx.clearRect(0, 0, canvas.width, canvas.height);
    }
    draw();
}

function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toast._id);
    toast._id = setTimeout(() => t.classList.remove('show'), 2200);
}

function popScore() {
    const el = document.getElementById('points-display');
    el.classList.remove('pop');
    void el.offsetWidth;
    el.classList.add('pop');
}

function setPuntosUI(texto, label, coin, modeClass) {
    document.getElementById('puntos-val').textContent = texto;
    document.getElementById('points-label').textContent = label;
    document.getElementById('coin-icon').textContent = coin;
    const disp = document.getElementById('points-display');
    disp.classList.remove('mode-energy', 'mode-lights');
    if (modeClass) disp.classList.add(modeClass);
}

function ocultarOverlays() {
    document.getElementById('pantalla-boom').classList.remove('visible');
    document.getElementById('pantalla-victoria').classList.remove('visible');
    document.getElementById('game-container').classList.remove('shake');
}

function seleccionarModo(modo, btn) {
    clearInterval(timerMulti);
    timerMulti = null;
    multiplicadorActivo = false;
    partidaActiva = false;
    juegoTerminado = true;
    ocultarOverlays();

    modoActual = modo;
    const cfg = MODOS[modo];
    document.body.classList.remove('mode-facil','mode-medio','mode-dificil');
    document.body.classList.add('mode-'+modo);

    document.querySelectorAll('.btn-nivel').forEach(b => {
        b.classList.remove('active');
        b.style.background = 'transparent';
        b.style.boxShadow = 'none';
        b.style.color = 'rgba(255,255,255,0.4)';
    });
    btn.classList.add('active');
    btn.style.background = cfg.colorBtn;
    btn.style.boxShadow = `0 0 18px ${cfg.colorBtn}99, 0 3px 0 ${cfg.colorBtn}55`;
    btn.style.color = (modo === 'dificil') ? '#0f172a' : '#fff';

    document.getElementById('modal-icon').textContent = cfg.icon;
    document.getElementById('modal-titulo').textContent = cfg.titulo;
    document.getElementById('modal-titulo').style.color = cfg.colorTitulo;
    document.getElementById('modal-titulo').style.textShadow = `0 0 16px ${cfg.colorTitulo}66`;
    document.getElementById('modal-desc').textContent = cfg.desc;
    document.getElementById('modal-instrucciones').classList.add('visible');

    document.getElementById('header-icon').textContent = cfg.icon;
    document.getElementById('main-title').textContent = cfg.nombre;

    if (modo === 'facil') {
        setPuntosUI(estado.facil.puntos, cfg.label, cfg.coin, null);
    } else if (modo === 'medio') {
        setPuntosUI('—', cfg.label, cfg.coin, 'mode-energy');
    } else {
        setPuntosUI('—', cfg.label, cfg.coin, 'mode-lights');
    }
    document.getElementById('shop-container').classList.add('hidden');
    document.getElementById('multi-wrapper').classList.add('hidden');
    const bp = document.getElementById('btn-pista-luces');
    if (bp) bp.classList.add('hidden');
    document.getElementById('tablero').innerHTML = '';
}

function empezarPartida() {
    document.getElementById('modal-instrucciones').classList.remove('visible');
    ocultarOverlays();
    juegoTerminado = false;
    partidaActiva = true;
    if (modoActual === 'facil') iniciarBuscaminas();
    else if (modoActual === 'medio') iniciarTesoro();
    else iniciarLuces();
}

function reintentar() {
    ocultarOverlays();
    juegoTerminado = false;
    partidaActiva = true;
    if (modoActual === 'facil') iniciarBuscaminas();
    else if (modoActual === 'medio') iniciarTesoro();
    else iniciarLuces();
}

/* ========== BUSCAMINAS ========== */
function iniciarBuscaminas() {
    filas = 8; cols = 8; minas = 10;
    const st = estado.facil;
    st.itemsUsados = { revelar: false, escudo: false, auditoria: false, pista: false, tiempo: false, barrido: false };
    st.tieneEscudo = false;

    if (st.itemsPendientes.escudo) {
        st.tieneEscudo = true;
        st.itemsUsados.escudo = true;
    }

    document.getElementById('shop-container').classList.remove('hidden');
    document.getElementById('multi-wrapper').classList.remove('hidden');
    document.getElementById('multi-wrapper').style.opacity = '1';
    document.getElementById('regalos-seccion').style.display = 'block';

    setPuntosUI(st.puntos, MODOS.facil.label, '⭐', null);
    actualizarTiendaUI();

    clearInterval(timerMulti);
    multiplicadorActivo = true;
    let ancho = 100;
    const barra = document.getElementById('barra-progreso');
    barra.style.width = '100%';
    timerMulti = setInterval(() => {
        if (modoActual !== 'facil' || juegoTerminado) {
            clearInterval(timerMulti);
            return;
        }
        ancho -= 1.2;
        barra.style.width = Math.max(0, ancho) + '%';
        if (ancho <= 0) {
            clearInterval(timerMulti);
            multiplicadorActivo = false;
            document.getElementById('multi-wrapper').style.opacity = '0.35';
        }
    }, 100);

    crearTableroDOM(filas, cols, 32);
    colocarMinas();
    requestAnimationFrame(() => ajustarEscalaTablero());
    requestAnimationFrame(() => ajustarEscalaTablero());

    if (st.itemsPendientes.revelar) {
        st.itemsPendientes.revelar = false;
        ejecutarItem('revelar', true);
    }
    if (st.itemsPendientes.auditoria) {
        st.itemsPendientes.auditoria = false;
        ejecutarItem('auditoria', true);
    }
    if (st.itemsPendientes.escudo) st.itemsPendientes.escudo = false;
    actualizarTiendaUI();
}

function colocarMinas() {
    let puestas = 0;
    while (puestas < minas) {
        const f = Math.floor(Math.random() * filas);
        const c = Math.floor(Math.random() * cols);
        if (!tableroLogico[f][c].esMina) {
            tableroLogico[f][c].esMina = true;
            puestas++;
        }
    }
    for (let f = 0; f < filas; f++) {
        for (let c = 0; c < cols; c++) {
            if (tableroLogico[f][c].esMina) continue;
            let n = 0;
            for (let i = -1; i <= 1; i++)
                for (let j = -1; j <= 1; j++)
                    if (tableroLogico[f + i]?.[c + j]?.esMina) n++;
            tableroLogico[f][c].vecinas = n;
        }
    }
}

function revelarBuscaminas(f, c) {
    if (juegoTerminado || !tableroLogico[f]?.[c]) return;
    const celda = tableroLogico[f][c];
    if (celda.revelada || celda.bandera) return;
    const el = document.getElementById(`c-${f}-${c}`);

    if (celda.esMina) {
        if (estado.facil.tieneEscudo) {
            estado.facil.tieneEscudo = false;
            celda.revelada = true;
            el.classList.add('revelada');
            el.textContent = '🛡️';
            toast('🛡️ Escudo usado — ¡te salvó!');
            actualizarTiendaUI();
            return;
        }
        finalizar(false);
        return;
    }

    celda.revelada = true;
    el.classList.add('revelada');
    const pts = multiplicadorActivo ? 200 : 100;
    estado.facil.puntos += pts;
    document.getElementById('puntos-val').textContent = estado.facil.puntos;
    popScore();

    if (celda.vecinas > 0) {
        el.textContent = celda.vecinas;
        el.style.color = ['#60a5fa','#34d399','#f87171','#a78bfa','#fbbf24','#22d3ee','#f472b6','#fff'][celda.vecinas - 1];
    } else {
        for (let i = -1; i <= 1; i++)
            for (let j = -1; j <= 1; j++)
                if (i || j) revelarBuscaminas(f + i, c + j);
    }
    verificarVictoriaMinas();
}

function verificarVictoriaMinas() {
    for (let f = 0; f < filas; f++)
        for (let c = 0; c < cols; c++)
            if (!tableroLogico[f][c].esMina && !tableroLogico[f][c].revelada) return;
    finalizar(true);
}

function manejarBandera(f, c, btn) {
    if (modoActual !== 'facil' || juegoTerminado) return;
    const celda = tableroLogico[f][c];
    if (celda.revelada) return;
    celda.bandera = !celda.bandera;
    btn.textContent = celda.bandera ? '🚩' : '';
}

function comprarItem(tipo) {
    if (modoActual !== 'facil' || juegoTerminado) return;
    const st = estado.facil;
    if (st.itemsUsados[tipo]) { toast('Ya usaste ese ítem'); return; }
    const costos = { revelar: 1500, escudo: 3000, auditoria: 1000, pista: 1200, tiempo: 800, barrido: 2500 };
    if (st.puntos < costos[tipo]) { toast('No te alcanzan las ⭐'); return; }
    st.puntos -= costos[tipo];
    document.getElementById('puntos-val').textContent = st.puntos;
    popScore();
    ejecutarItem(tipo, false);
}

function ejecutarItem(tipo, gratis) {
    const st = estado.facil;
    st.itemsUsados[tipo] = true;
    if (tipo === 'revelar') flashMinas();
    if (tipo === 'escudo') {
        st.tieneEscudo = true;
        toast(gratis ? '🛡️ Escudo listo (regalo)' : '🛡️ Escudo activado');
    }
    if (tipo === 'auditoria') marcarTresMinas();
    if (tipo === 'pista') abrirPista();
    if (tipo === 'tiempo') recargarBonoTiempo();
    if (tipo === 'barrido') abrirBarrido();
    actualizarTiendaUI();
}

function casillasSegurasLibres() {
    const list = [];
    for (let f = 0; f < filas; f++)
        for (let c = 0; c < cols; c++) {
            const cel = tableroLogico[f][c];
            if (!cel.esMina && !cel.revelada && !cel.bandera) list.push({ f, c });
        }
    return list;
}

function abrirPista() {
    const list = casillasSegurasLibres();
    if (!list.length) { toast('No hay casillas seguras libres'); return; }
    list.sort(() => Math.random() - 0.5);
    const { f, c } = list[0];
    revelarBuscaminas(f, c);
    toast('🔍 Pista: se abrió una casilla segura');
}

function recargarBonoTiempo() {
    clearInterval(timerMulti);
    multiplicadorActivo = true;
    let ancho = 100;
    const barra = document.getElementById('barra-progreso');
    const wrap = document.getElementById('multi-wrapper');
    if (wrap) { wrap.classList.remove('hidden'); wrap.style.opacity = '1'; }
    if (barra) barra.style.width = '100%';
    timerMulti = setInterval(() => {
        if (modoActual !== 'facil' || juegoTerminado) {
            clearInterval(timerMulti);
            return;
        }
        ancho -= 1.2;
        if (barra) barra.style.width = Math.max(0, ancho) + '%';
        if (ancho <= 0) {
            clearInterval(timerMulti);
            multiplicadorActivo = false;
            if (wrap) wrap.style.opacity = '0.35';
        }
    }, 100);
    toast('⏱️ ¡Bono ×2 recargado!');
}

function abrirBarrido() {
    const list = casillasSegurasLibres();
    if (!list.length) { toast('No hay casillas para barrer'); return; }
    // Prefer empty (0) cells for bigger effect
    const ceros = list.filter(({ f, c }) => tableroLogico[f][c].vecinas === 0);
    const pool = ceros.length ? ceros : list;
    pool.sort(() => Math.random() - 0.5);
    const n = Math.min(5, pool.length);
    for (let i = 0; i < n; i++) {
        const { f, c } = pool[i];
        if (!tableroLogico[f][c].revelada) revelarBuscaminas(f, c);
    }
    toast(`✨ Barrido: ${n} zona(s) segura(s)`);
}

function flashMinas() {
    for (let f = 0; f < filas; f++)
        for (let c = 0; c < cols; c++)
            if (tableroLogico[f][c].esMina)
                document.getElementById(`c-${f}-${c}`).classList.add('flash-red');
    setTimeout(() => {
        document.querySelectorAll('.flash-red').forEach(el => el.classList.remove('flash-red'));
    }, 1400);
    toast('👁️ ¡Minas al descubierto!');
}

function marcarTresMinas() {
    const lista = [];
    for (let f = 0; f < filas; f++)
        for (let c = 0; c < cols; c++)
            if (tableroLogico[f][c].esMina && !tableroLogico[f][c].bandera && !tableroLogico[f][c].revelada)
                lista.push({ f, c });
    lista.sort(() => Math.random() - 0.5);
    const n = Math.min(3, lista.length);
    for (let i = 0; i < n; i++) {
        const { f, c } = lista[i];
        tableroLogico[f][c].bandera = true;
        document.getElementById(`c-${f}-${c}`).textContent = '🚩';
    }
    toast(n ? `🚩 ${n} mina(s) marcadas` : 'No había minas libres');
}

function actualizarTiendaUI() {
    const st = estado.facil;
    ['revelar', 'escudo', 'auditoria', 'pista', 'tiempo', 'barrido'].forEach(t => {
        const el = document.getElementById(`item-${t}`);
        if (!el) return;
        el.className = 'shop-item';
        if (st.itemsUsados[t]) el.classList.add('disabled');
        if (st.tieneEscudo && t === 'escudo') el.classList.add('owned');
    });
}

function reclamarRegalo(tipo) {
    const st = estado.facil;
    st.itemsPendientes = { revelar: false, escudo: false, auditoria: false, pista: false, tiempo: false, barrido: false };
    st.itemsPendientes[tipo] = true;
    document.querySelectorAll('.regalo-ops button').forEach(b => b.classList.add('taken'));
    document.getElementById(`regalo-${tipo}`).classList.remove('taken');
    toast('✨ Bono guardado para la próxima');
}

/* ========== TESORO ========== */
function iniciarTesoro() {
    filas = 14; cols = 14;
    estado.medio.movimientos = 12;
    document.getElementById('shop-container').classList.add('hidden');
    document.getElementById('multi-wrapper').classList.add('hidden');
    document.getElementById('regalos-seccion').style.display = 'none';
    const bp = document.getElementById('btn-pista-luces');
    if (bp) bp.classList.add('hidden');
    clearInterval(timerMulti);
    setPuntosUI(estado.medio.movimientos, MODOS.medio.label, '⚡', 'mode-energy');
    tesoroF = Math.floor(Math.random() * filas);
    tesoroC = Math.floor(Math.random() * cols);
    crearTableroDOM(filas, cols, 26);
    let rocas = Math.floor(filas * cols * 0.18);
    while (rocas > 0) {
        const f = Math.floor(Math.random() * filas), c = Math.floor(Math.random() * cols);
        if ((f === tesoroF && c === tesoroC) || tableroLogico[f][c].roca) continue;
        tableroLogico[f][c].roca = true;
        const el = document.getElementById('c-' + f + '-' + c);
        el.classList.add('roca');
        el.textContent = '🪨';
        rocas--;
    }
    requestAnimationFrame(() => ajustarEscalaTablero());
}

function revelarTesoro(f, c) {
    if (juegoTerminado || tableroLogico[f][c].revelada) return;
    const el = document.getElementById('c-' + f + '-' + c);
    if (tableroLogico[f][c].roca) {
        el.classList.add('golpe');
        setTimeout(() => el.classList.remove('golpe'), 350);
        estado.medio.movimientos = Math.max(0, estado.medio.movimientos - 2);
        document.getElementById('puntos-val').textContent = estado.medio.movimientos;
        popScore();
        toast('🪨 ¡Roca! −2 movimientos');
        if (estado.medio.movimientos <= 0) {
            document.getElementById('c-' + tesoroF + '-' + tesoroC).textContent = '💎';
            document.getElementById('boom-text').textContent = '¡SIN TURNOS!';
            finalizar(false);
        }
        return;
    }
    tableroLogico[f][c].revelada = true;
    estado.medio.movimientos--;
    document.getElementById('puntos-val').textContent = estado.medio.movimientos;
    popScore();
    if (f === tesoroF && c === tesoroC) {
        el.classList.add('tesoro'); el.textContent = '💎';
        finalizar(true); return;
    }
    const dist = Math.abs(f - tesoroF) + Math.abs(c - tesoroC);
    el.classList.add('revelada');
    el.textContent = dist;
    if (dist <= 2) { el.style.color = '#ff3b4a'; el.style.textShadow = '0 0 10px rgba(255,59,74,0.9)'; }
    else if (dist <= 5) el.style.color = '#fbbf24';
    else el.style.color = '#22d3ee';
    if (estado.medio.movimientos <= 0) {
        document.getElementById('c-' + tesoroF + '-' + tesoroC).textContent = '💎';
        document.getElementById('boom-text').textContent = '¡SIN TURNOS!';
        finalizar(false);
    }
}

function iniciarLuces() {
    filas = 5; cols = 5;
    document.getElementById('shop-container').classList.add('hidden');
    document.getElementById('multi-wrapper').classList.add('hidden');
    document.getElementById('regalos-seccion').style.display = 'none';
    const bp = document.getElementById('btn-pista-luces');
    if (bp) bp.classList.remove('hidden');
    clearInterval(timerMulti);
    setPuntosUI('ON', MODOS.dificil.label, '💡', 'mode-lights');
    crearTableroDOM(filas, cols, 48);
    // Siempre resoluble: OFF + clics aleatorios. Solución = repetir esos clics (mod 2).
    const presses = Array.from({length: filas}, () => Array(cols).fill(0));
    const clics = 7 + Math.floor(Math.random() * 6);
    for (let n = 0; n < clics; n++) {
        const f = Math.floor(Math.random() * filas);
        const c = Math.floor(Math.random() * cols);
        presses[f][c] ^= 1;
        aplicarCruce(f, c, false);
    }
    lucesSolucion = presses.map(r => r.slice());
    let on = 0;
    for (let f = 0; f < filas; f++) for (let c = 0; c < cols; c++) if (tableroLogico[f][c].encendida) on++;
    if (on === 0) { aplicarCruce(2, 2, false); lucesSolucion[2][2] ^= 1; }
    actualizarContadorLuces();
    requestAnimationFrame(() => ajustarEscalaTablero());
}

function clickLuces(f, c) {
    if (juegoTerminado) return;
    aplicarCruce(f, c, true);
    if (lucesSolucion) lucesSolucion[f][c] ^= 1;
    document.querySelectorAll('.hint-glow').forEach(e => e.classList.remove('hint-glow'));
}

function pistaLuces() {
    if (juegoTerminado || modoActual !== 'dificil') return;
    document.querySelectorAll('.hint-glow').forEach(e => e.classList.remove('hint-glow'));
    if (lucesSolucion) {
        for (let f = 0; f < filas; f++)
            for (let c = 0; c < cols; c++)
                if (lucesSolucion[f][c] === 1) {
                    document.getElementById('c-' + f + '-' + c).classList.add('hint-glow');
                    toast('💡 Prueba esta casilla (a veces no está encendida, y está bien)');
                    return;
                }
    }
    toast('¡Casi! Sigue apagando');
}

function aplicarCruce(f, c, chequear) {
    [[0,0],[-1,0],[1,0],[0,-1],[0,1]].forEach(([df, dc]) => invertirLuz(f + df, c + dc));
    if (chequear) {
        actualizarContadorLuces();
        verificarVictoriaLuces();
    }
}

function invertirLuz(f, c) {
    if (f < 0 || f >= filas || c < 0 || c >= cols) return;
    const celda = tableroLogico[f][c];
    const el = document.getElementById(`c-${f}-${c}`);
    celda.encendida = !celda.encendida;
    if (celda.encendida) el.classList.add('luz-on');
    else el.classList.remove('luz-on');
}

function actualizarContadorLuces() {
    let on = 0;
    for (let f = 0; f < filas; f++)
        for (let c = 0; c < cols; c++)
            if (tableroLogico[f][c].encendida) on++;
    document.getElementById('puntos-val').textContent = on === 0 ? 'OFF' : on + ' ON';
    popScore();
}

function verificarVictoriaLuces() {
    for (let f = 0; f < filas; f++)
        for (let c = 0; c < cols; c++)
            if (tableroLogico[f][c].encendida) return;
    finalizar(true);
}

/* ========== TABLERO ========== */
function crearTableroDOM(fCount, cCount, sizePx) {
    const div = document.getElementById('tablero');
    div.style.gridTemplateColumns = `repeat(${cCount}, auto)`;
    div.innerHTML = '';
    tableroLogico = [];

    for (let r = 0; r < fCount; r++) {
        tableroLogico[r] = [];
        for (let c = 0; c < cCount; c++) {
            tableroLogico[r][c] = {
                esMina: false, revelada: false, vecinas: 0, bandera: false, encendida: false, roca: false
            };
            const btn = document.createElement('div');
            btn.className = 'celda';
            btn.id = `c-${r}-${c}`;
            const s = sizePx + 'px';
            btn.style.width = btn.style.height = btn.style.minWidth = btn.style.minHeight = s;
            btn.style.borderRadius = (modoActual === 'dificil' ? 14 : 8) + 'px';
            btn.style.fontSize = (sizePx > 40 ? '1rem' : sizePx > 30 ? '0.85rem' : '0.72rem');
            // stagger entrance
            btn.style.opacity = '0';
            btn.style.transform = 'scale(0.5)';
            btn.onclick = () => onClickCelda(r, c);
            btn.oncontextmenu = (e) => { e.preventDefault(); manejarBandera(r, c, btn); };
            div.appendChild(btn);
            requestAnimationFrame(() => {
                setTimeout(() => {
                    btn.style.transition = 'opacity 0.25s ease, transform 0.3s cubic-bezier(0.34,1.4,0.64,1)';
                    btn.style.opacity = '1';
                    btn.style.transform = 'scale(1)';
                }, (r * cCount + c) * 12);
            });
        }
    }
}

function onClickCelda(f, c) {
    if (juegoTerminado || !partidaActiva) return;
    if (modoActual === 'facil') revelarBuscaminas(f, c);
    else if (modoActual === 'medio') revelarTesoro(f, c);
    else clickLuces(f, c);
}

/* ========== FIN ========== */
function finalizar(victoria) {
    juegoTerminado = true;
    partidaActiva = false;
    clearInterval(timerMulti);

    if (!victoria) {
        document.getElementById('game-container').classList.add('shake');
        if (modoActual === 'facil') {
            estado.facil.puntos = 0;
            document.getElementById('puntos-val').textContent = '0';
            estado.facil.itemsPendientes = { revelar: false, escudo: false, auditoria: false, pista: false, tiempo: false, barrido: false };
            for (let f = 0; f < filas; f++)
                for (let c = 0; c < cols; c++)
                    if (tableroLogico[f][c].esMina) {
                        const el = document.getElementById(`c-${f}-${c}`);
                        el.textContent = '💣';
                        el.classList.add('mina');
                    }
            document.getElementById('boom-text').textContent = '¡BOOM!';
        } else if (modoActual === 'medio') {
            document.getElementById('boom-text').textContent = '¡SIN TURNOS!';
        } else {
            document.getElementById('boom-text').textContent = 'Sigue intentando';
        }
        setTimeout(() => document.getElementById('pantalla-boom').classList.add('visible'), 380);
    } else {
        lanzarConfeti();
        if (modoActual === 'facil') {
            document.getElementById('regalos-seccion').style.display = 'block';
            document.querySelectorAll('.regalo-ops button').forEach(b => b.classList.remove('taken'));
        } else {
            document.getElementById('regalos-seccion').style.display = 'none';
        }
        setTimeout(() => document.getElementById('pantalla-victoria').classList.add('visible'), 300);
    }
}

seleccionarModo('facil', document.getElementById('btn-facil'));
